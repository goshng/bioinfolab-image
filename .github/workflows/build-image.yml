name: build-image

on:
  push:
    branches: [main]
    paths:
      - "*/Dockerfile"
      - "envs/**"
      - "common/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 소문자 소유자 이름
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # 아래 네 단계는 순서를 바꾸면 안 된다.
      # conda 는 basic 을, seq 는 conda 를, genome 은 seq 를 FROM 으로 쓴다.

      - name: 1. basic
        uses: docker/build-push-action@v6
        with:
          context: .
          file: basic/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/bioinfolab:basic
          cache-from: type=gha,scope=basic
          cache-to: type=gha,scope=basic,mode=min

      - name: 2. conda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: conda/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/bioinfolab:conda
          cache-from: type=gha,scope=conda
          cache-to: type=gha,scope=conda,mode=min

      - name: 3. seq
        uses: docker/build-push-action@v6
        with:
          context: .
          file: seq/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/bioinfolab:seq
          cache-from: type=gha,scope=seq
          cache-to: type=gha,scope=seq,mode=min

      - name: 4. genome
        uses: docker/build-push-action@v6
        with:
          context: .
          file: genome/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/bioinfolab:genome
          cache-from: type=gha,scope=genome
          cache-to: type=gha,scope=genome,mode=min
