name: build-image

# 학기 전에 한 번, 그리고 Dockerfile이나 envs를 고칠 때마다 자동으로 이미지를 만든다.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "envs/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 소문자 소유자 이름 만들기
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/bioinfolab:2026a
            ghcr.io/${{ steps.owner.outputs.name }}/bioinfolab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
